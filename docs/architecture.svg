<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-label="The agent and the components it talks to: yeetd, cognee, ollama, and a watched coding agent">
  <style>
    svg{--bg:#fbfbf9;--panel:#ffffff;--ink:#18191b;--muted:#6b6f74;
        --line:#e5e4df;--wire:#b7b6af;--accent:#4a5bd4;--accent-soft:#eef0fc;
        --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
        --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
    @media (prefers-color-scheme:dark){svg{
        --bg:#0f1011;--panel:#161719;--ink:#ececed;--muted:#989ca2;
        --line:#282a2c;--wire:#3c3e40;--accent:#93a4f7;--accent-soft:#191f3a;}}
    .bg{fill:var(--bg)}
    .node{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
    .node.hub{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.75}
    .node.watched{stroke-dasharray:5 4}
    .pill{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
    .edge{fill:none;stroke:var(--wire);stroke-width:1.5}
    .flow{fill:none;stroke:var(--wire);stroke-width:1.3;stroke-dasharray:4 3}
    .t-hub{fill:var(--ink);font-family:var(--sans);font-size:17px;font-weight:600;text-anchor:middle}
    .t-hub-sub{fill:var(--muted);font-family:var(--sans);font-size:11px;text-anchor:middle}
    .t-name{fill:var(--ink);font-family:var(--mono);font-size:15px;font-weight:500;text-anchor:middle}
    .t-role{fill:var(--muted);font-family:var(--sans);font-size:11px;text-anchor:middle}
    .t-q{fill:var(--ink);font-family:var(--sans);font-size:14px;text-anchor:middle}
    .t-verb{fill:var(--muted);font-family:var(--mono);font-size:11px;text-anchor:middle}
    .halo{fill:var(--bg)}
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0.5,1 L9,5 L0.5,9" fill="none" stroke="var(--wire)"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="490"/>

  <!-- edges first; arrowheads sit in the gap between line and node -->
  <g>
    <!-- data flow: yeetd readings and activity recorded into cognee's memory -->
    <path class="flow" d="M135,120 C135,74 625,74 625,120" marker-end="url(#arw)"/>
    <path class="edge" d="M380,72 V294" marker-end="url(#arw)"/>
    <path class="edge" d="M327,296 L181,186" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <path class="edge" d="M433,296 L579,186" marker-start="url(#arw)" marker-end="url(#arw)"/>
    <path class="edge" d="M466,369 L539,398" marker-end="url(#arw)"/>
    <path class="edge" d="M135,186 V394" marker-end="url(#arw)"/>
    <path class="edge" d="M625,186 V394" marker-end="url(#arw)"/>
  </g>

  <!-- you -->
  <rect class="pill" x="180" y="28" width="400" height="40" rx="20"/>
  <text class="t-q" x="380" y="53">&#8220;Which of these agents is up to something?&#8221;</text>

  <!-- agent hub -->
  <rect class="node hub" x="300" y="300" width="160" height="72" rx="16"/>
  <text class="t-hub" x="380" y="332">sentinel</text>
  <text class="t-hub-sub" x="380" y="351">memory service</text>

  <!-- yeetd -->
  <rect class="node" x="60" y="120" width="150" height="62" rx="12"/>
  <text class="t-name" x="135" y="152">yeetd</text>
  <text class="t-role" x="135" y="170">activity log</text>

  <!-- cognee -->
  <rect class="node" x="550" y="120" width="150" height="62" rx="12"/>
  <text class="t-name" x="625" y="152">cognee</text>
  <text class="t-role" x="625" y="170">memory</text>

  <!-- coding agent (watched) -->
  <rect class="node watched" x="60" y="400" width="150" height="62" rx="12"/>
  <text class="t-name" x="135" y="432">coding agents</text>
  <text class="t-role" x="135" y="450">a fleet, watched</text>

  <!-- ollama -->
  <rect class="node" x="550" y="400" width="150" height="62" rx="12"/>
  <text class="t-name" x="625" y="432">LLM</text>
  <text class="t-role" x="625" y="450">cognee's configured model</text>

  <!-- edge verbs (on top, with halos). two-way edges carry both directions. -->
  <g>
    <rect class="halo" x="306" y="77" width="148" height="16"/>
    <text class="t-verb" x="380" y="89">actions polled every window &#8594; findings remembered</text>

    <rect class="halo" x="356" y="172" width="48" height="16"/>
    <text class="t-verb" x="380" y="184">asks</text>

    <rect class="halo" x="206" y="223" width="96" height="16"/>
    <text class="t-verb" x="254" y="235">set watch</text>
    <rect class="halo" x="206" y="244" width="96" height="16"/>
    <text class="t-verb" x="254" y="256">actions</text>

    <rect class="halo" x="456" y="223" width="100" height="16"/>
    <text class="t-verb" x="506" y="235">profile, findings, reviews</text>
    <rect class="halo" x="456" y="244" width="100" height="16"/>
    <text class="t-verb" x="506" y="256">recall profile, reviews</text>

    <rect class="halo" x="476" y="374" width="54" height="16"/>
    <text class="t-verb" x="503" y="386">reason</text>

    <rect class="halo" x="106" y="285" width="58" height="16"/>
    <text class="t-verb" x="135" y="297">watches</text>

    <rect class="halo" x="597" y="285" width="48" height="16"/>
    <text class="t-verb" x="625" y="297">embed</text>
  </g>
</svg>
